<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>CyberWrap</title>
  <meta name="description" content="A 3D WebGL delivery driving arcade game inspired by Vortelli's Pizza Delivery.">
  <meta property="og:title" content="CyberWrap">
  <meta property="og:description" content="A 3D WebGL delivery driving arcade game inspired by Vortelli's Pizza Delivery.">


  <!-- =========================================================
       CYBERWRAP STYLES
  ========================================================= -->

  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;
      height: 100dvh;

      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;

      background-color: #07131b;
      /* No background image during initialization */
      
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    
    /* Show mountain background only during gameplay (not booting) */
    body:not(.cyberwrap-booting) {
      background-image: url("/assets/mountain-view.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }


    /* =========================================================
       CYBERWRAP BOOT OPENER
    ========================================================= */

   #cyberwrap-opener {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100dvh;

  z-index: 2147483647;

  background: #000;

  opacity: 1;
  visibility: visible;

  pointer-events: auto;
  touch-action: manipulation;

  cursor: pointer;

  overflow: hidden;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;

  -webkit-tap-highlight-color: transparent;

  transition:
    opacity 0.8s ease,
    visibility 0.8s ease;
}

    /* =========================================================
       HIDDEN OPENER
    ========================================================= */

    #cyberwrap-opener.hidden {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}


    /* =========================================================
       OPENER IMAGE
    ========================================================= */

    .opener-image {

      position: absolute;

      inset: -6%;

      background-image:
        url("/assets/cyberwrap-main-opener.webp");

      background-position: center center;

      background-size: cover;

      background-repeat: no-repeat;

      transform-origin: center center;

      animation:
        opener-camera 4.5s ease-out forwards,
        opener-drift 4.5s ease-in-out infinite;

      will-change: transform;
    }


    /* =========================================================
       CINEMATIC CAMERA PUSH
    ========================================================= */

    @keyframes opener-camera {

      0% {
        transform: scale(1.02);
      }

      100% {
        transform: scale(1.13);
      }

    }


    /* =========================================================
       SUBTLE CAMERA DRIFT
    ========================================================= */

    @keyframes opener-drift {

      0% {
        translate: 0 0;
      }

      50% {
        translate: -0.7% -0.4%;
      }

      100% {
        translate: 0 0;
      }

    }


    /* =========================================================
       DIGITAL SCANLINES
    ========================================================= */

    .opener-scanlines {

      position: absolute;

      inset: 0;

      background:
        repeating-linear-gradient(
          to bottom,

          rgba(255, 255, 255, 0.025) 0px,

          rgba(255, 255, 255, 0.025) 1px,

          transparent 1px,

          transparent 5px
        );

      animation:
        scanline-move 1.8s linear infinite;

      pointer-events: none;

      mix-blend-mode: screen;
    }


    @keyframes scanline-move {

      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 80px;
      }

    }


    /* =========================================================
       CINEMATIC VIGNETTE
    ========================================================= */

    .opener-vignette {

      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          ellipse at center,

          transparent 42%,

          rgba(0, 0, 0, 0.68) 100%
        );

      pointer-events: none;
    }


    /* =========================================================
       START UI
    ========================================================= */

    #opener-content {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      padding-bottom: 11vh;

      pointer-events: none;
    }


    #cyberwrap-website {

      appearance: none;
      -webkit-appearance: none;

      box-sizing: border-box;

      border: 1px solid rgba(0, 255, 255, 0.75);

      border-radius: 999px;

      padding: 10px 14px;

      background: rgba(0, 0, 0, 0.48);

      color: #ffffff;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.08em;

      text-align: center;

      text-decoration: none;

      text-shadow: 0 0 8px rgba(0, 255, 255, 0.75);

      box-shadow:
        0 0 10px rgba(0, 255, 255, 0.25),
        inset 0 0 10px rgba(0, 255, 255, 0.06);

      cursor: pointer;

      pointer-events: auto;

      touch-action: manipulation;

      -webkit-tap-highlight-color: transparent;
    }


    #cyberwrap-website:active {

      transform: scale(0.96);

      background: rgba(0, 255, 255, 0.16);
    }


    #cyberwrap-website {

      position: absolute;

      top: max(20px, env(safe-area-inset-top));

      right: max(16px, env(safe-area-inset-right));

      margin: 0;

      border-width: 2px;

      padding: 11px 16px;

      color: #74ffff;

      font-size: 11px;
    }


    #cyberwrap-website {

      border: 0;

      background: #dc2626;

      color: #ffffff;

      text-shadow: none;

      box-shadow: none;
    }


    #cyberwrap-website:active {

      background: #b91c1c;
    }


    /* =========================================================
       MODE SELECTION MENU
    ========================================================= */

    #cw-mode-selection {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      gap: 16px;
      width: min(640px, 92vw);
      margin: 0 auto;
      pointer-events: auto;
      z-index: 10;
    }

    .cw-mode-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 16px 14px 14px 14px;
      background: rgba(5, 18, 28, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(0, 240, 255, 0.45);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.08);
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    #cw-card-freeroam {
      border-color: rgba(251, 191, 36, 0.45);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(251, 191, 36, 0.08);
    }

    .cw-mode-card-title {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #74ffff;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
      margin-bottom: 6px;
    }

    .cw-mode-card-title.cw-title-gold {
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
    }

    .cw-mode-card-subtitle {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(10px, 2.5vw, 12px);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.4;
      margin-bottom: 12px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cw-mode-btn {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      border-radius: 999px;
      padding: 12px 18px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(12px, 3vw, 15px);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-align: center;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    /* Challenge Button */
    #cyberwrap-start {
      border: 2px solid rgba(0, 255, 255, 0.9);
      background: rgba(0, 240, 255, 0.15);
      color: #ffffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.85);
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
      animation: cyberwrap-pulse 1.6s ease-in-out infinite;
    }

    #cyberwrap-start:active {
      transform: scale(0.96);
      background: rgba(0, 255, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
    }

    /* Free Roam Button */
    #cw-btn-freeroam {
      border: 2px solid rgba(251, 191, 36, 0.9);
      background: rgba(251, 191, 36, 0.15);
      color: #ffffff;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.85);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.35);
    }

    #cw-btn-freeroam:active {
      transform: scale(0.96);
      background: rgba(251, 191, 36, 0.3);
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
    }

    #cyberwrap-start:disabled, #cw-btn-freeroam:disabled {
      opacity: 0.65;
      cursor: default;
      animation: none;
    }

    @media (max-width: 480px) and (orientation: portrait) {
      #cw-mode-selection {
        flex-direction: column;
        gap: 10px;
        width: 88vw;
      }
      .cw-mode-card {
        padding: 10px 12px 10px 12px;
      }
      .cw-mode-card-subtitle {
        margin-bottom: 8px;
        min-height: unset;
      }
    }

    /* =========================================================
       STARTING STATE
    ========================================================= */

    #cyberwrap-opener.starting #cyberwrap-start {

  animation: none;

  opacity: 0.7;

  letter-spacing: 0.08em;
}


    /* =========================================================
       TAP PULSE
    ========================================================= */

    @keyframes cyberwrap-pulse {

      0%,
      100% {

        opacity: 0.45;

        transform: scale(0.98);
      }

      50% {

        opacity: 1;

        transform: scale(1);
      }

    }


    /* =========================================================
       DRIVEZONE PLACEMENT HINT
    ========================================================= */

    #cyberwrap-placement-hint {

      position: fixed;

      left: 50%;

      bottom: 12%;

      transform:
        translateX(-50%);

      z-index: 1000;

      width: 90%;

      text-align: center;

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(16px, 4vw, 26px);

      font-weight: 700;

      letter-spacing:
        0.12em;

      text-shadow:
        0 0 8px rgba(0, 255, 255, 0.9),
        0 0 18px rgba(0, 255, 255, 0.5);

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;

      opacity: 1;

      visibility: visible;

      animation:
        placement-pulse 1.4s ease-in-out infinite;
    }


    /* =========================================================
       HIDDEN PLACEMENT HINT
    ========================================================= */

    #cyberwrap-placement-hint.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      animation: none;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }


    /* =========================================================
       PLACEMENT PULSE
    ========================================================= */

    @keyframes placement-pulse {

      0%,
      100% {

        opacity: 0.55;
      }

      50% {

        opacity: 1;
      }

    }


    /* =========================================================
       BOOT PROTECTION
    ========================================================= */

    body.cyberwrap-booting {

      overflow: hidden;
    }


    /*
     * Hide normal HTML controls while CyberWrap
     * is still in its startup phase.
     *
     * The AR scene remains active underneath.
     */

    body.cyberwrap-booting button,
    body.cyberwrap-booting [role="button"],
    body.cyberwrap-booting input,
    body.cyberwrap-booting textarea,
    body.cyberwrap-booting select {

      visibility: hidden !important;

      pointer-events: none !important;
    }

body.cyberwrap-booting #cyberwrap-start,
body.cyberwrap-booting #cw-btn-freeroam,
body.cyberwrap-booting #cw-mode-selection,
body.cyberwrap-booting .cw-mode-card,
body.cyberwrap-booting .cw-mode-btn,
body.cyberwrap-booting #cyberwrap-website {

  visibility: visible !important;

  pointer-events: auto !important;
}

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      #opener-content {

        padding-bottom: 10vh;
      }

      #cyberwrap-start {

      font-size:
        clamp(17px, 5vw, 24px);

      min-width: 180px;

      padding:
        15px 30px;

      letter-spacing:
        0.14em;
    }

      #cyberwrap-placement-hint {

        bottom: 11%;

        width: 92%;

        font-size:
          clamp(15px, 4.5vw, 22px);

        letter-spacing:
          0.10em;
      }

    }


    /* =========================================================
       VERY SMALL PHONES
    ========================================================= */

    @media (max-height: 600px) {

      #opener-content {

        padding-bottom: 7vh;
      }

      #opener-status {

        font-size: 16px;
      }

      #cyberwrap-placement-hint {

        bottom: 8%;
      }

    }


    /* =========================================================
       TABLETS
    ========================================================= */

    @media (min-width: 601px) {

      #cyberwrap-start {

        font-size:
          clamp(20px, 3vw, 30px);
      }

    }


    /* =========================================================
       LANDSCAPE
    ========================================================= */

    @media (orientation: landscape) {

      #opener-content {

        padding-bottom: 6vh;
      }

      #cyberwrap-start {

        font-size:
          clamp(16px, 3vw, 24px);
      }

      #cyberwrap-placement-hint {

        bottom: 8%;

        font-size:
          clamp(15px, 3vw, 22px);
      }

    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .opener-image {

        animation: none;

        transform:
          scale(1.04);
      }

      .opener-scanlines {

        animation: none;
      }

      #cyberwrap-start {

      animation: none;

      opacity: 1;
      }

      #cyberwrap-placement-hint {

        animation: none;

        opacity: 1;
      }

    }


    /* =========================================================
       SAFARI / IOS TOUCH
    ========================================================= */

    #cyberwrap-opener,
    #cyberwrap-opener * {

      box-sizing: border-box;
    }

    #cyberwrap-rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2147483648;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #07131b;
      color: #74ffff;
      font: 800 24px/1.2 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-align: center;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #cyberwrap-rotate {
        display: flex;
      }
    }


    #cyberwrap-opener {

      cursor: pointer;

      touch-action: manipulation;

      -webkit-touch-callout: none;

      -webkit-tap-highlight-color: transparent;
    }

  </style>

<body class="cyberwrap-booting">

  <div id="cyberwrap-rotate" aria-live="polite">ROTATE YOUR PHONE</div>


  <!-- =========================================================
       CYBERWRAP START OPENER

      There is one browser start control.
  ========================================================= -->

  <div id="cyberwrap-opener">

    <!-- Main artwork -->

    <div class="opener-image"></div>


    <!-- Digital scanlines -->

    <div class="opener-scanlines"></div>


    <!-- Cinematic vignette -->

    <div class="opener-vignette"></div>


    <!-- Start message -->

    <div id="opener-content">

    <a
      id="cyberwrap-website"
      href="https://dailybreadshawarma.store"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit Daily Bread Shawarma website"
    >
      ORDER ONLINE
    </a>

    <div id="cw-mode-selection" role="group" aria-label="Game Mode Selection">
      <!-- Daily Challenge Card -->
      <div class="cw-mode-card" id="cw-card-challenge">
        <div class="cw-mode-card-title">DAILY CHALLENGE</div>
        <div class="cw-mode-card-subtitle">60 SECONDS<br>EARN POINTS & REWARDS</div>
        <button
          id="cyberwrap-start"
          class="cw-mode-btn"
          type="button"
          aria-label="Play Daily Challenge"
        >
          PLAY CHALLENGE
        </button>
      </div>

      <!-- Free Roam Card -->
      <div class="cw-mode-card" id="cw-card-freeroam">
        <div class="cw-mode-card-title cw-title-gold">FREE ROAM</div>
        <div class="cw-mode-card-subtitle">180 SECONDS<br>EXPLORE & DRIVE</div>
        <button
          id="cw-btn-freeroam"
          class="cw-mode-btn"
          type="button"
          aria-label="Start Free Roam"
        >
          FREE ROAM
        </button>
      </div>
    </div>

</div>

  </div>
