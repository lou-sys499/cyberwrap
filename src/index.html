<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>CyberWrap</title>


  <!-- =========================================================
       CYBERWRAP STYLES
  ========================================================= -->

  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      -webkit-tap-highlight-color: transparent;
    }


    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }


    /* =========================================================
       CYBERWRAP BOOT OPENER
    ========================================================= */

   #cyberwrap-opener {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100dvh;

  z-index: 2147483647;

  background: #000;

  opacity: 1;
  visibility: visible;

  pointer-events: auto;
  touch-action: manipulation;

  cursor: pointer;

  overflow: hidden;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;

  -webkit-tap-highlight-color: transparent;

  transition:
    opacity 0.8s ease,
    visibility 0.8s ease;
}

    /* =========================================================
       HIDDEN OPENER
    ========================================================= */

    #cyberwrap-opener.hidden {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}


    /* =========================================================
       OPENER IMAGE
    ========================================================= */

    .opener-image {

      position: absolute;

      inset: -6%;

      background-image:
        url("/assets/cyberwrap-main-opener.webp");

      background-position: center center;

      background-size: cover;

      background-repeat: no-repeat;

      transform-origin: center center;

      animation:
        opener-camera 4.5s ease-out forwards,
        opener-drift 4.5s ease-in-out infinite;

      will-change: transform;
    }


    /* =========================================================
       CINEMATIC CAMERA PUSH
    ========================================================= */

    @keyframes opener-camera {

      0% {
        transform: scale(1.02);
      }

      100% {
        transform: scale(1.13);
      }

    }


    /* =========================================================
       SUBTLE CAMERA DRIFT
    ========================================================= */

    @keyframes opener-drift {

      0% {
        translate: 0 0;
      }

      50% {
        translate: -0.7% -0.4%;
      }

      100% {
        translate: 0 0;
      }

    }


    /* =========================================================
       DIGITAL SCANLINES
    ========================================================= */

    .opener-scanlines {

      position: absolute;

      inset: 0;

      background:
        repeating-linear-gradient(
          to bottom,

          rgba(255, 255, 255, 0.025) 0px,

          rgba(255, 255, 255, 0.025) 1px,

          transparent 1px,

          transparent 5px
        );

      animation:
        scanline-move 1.8s linear infinite;

      pointer-events: none;

      mix-blend-mode: screen;
    }


    @keyframes scanline-move {

      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 80px;
      }

    }


    /* =========================================================
       CINEMATIC VIGNETTE
    ========================================================= */

    .opener-vignette {

      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          ellipse at center,

          transparent 42%,

          rgba(0, 0, 0, 0.68) 100%
        );

      pointer-events: none;
    }


    /* =========================================================
       START UI
    ========================================================= */

    #opener-content {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      padding-bottom: 11vh;

      pointer-events: none;
    }


    #account-actions {

      position: absolute;

      top: max(20px, env(safe-area-inset-top));

      left: max(16px, env(safe-area-inset-left));

      display: flex;

      gap: 8px;

      pointer-events: auto;
    }


    .cyberwrap-account-button,
    #cyberwrap-website {

      appearance: none;
      -webkit-appearance: none;

      box-sizing: border-box;

      border: 1px solid rgba(0, 255, 255, 0.75);

      border-radius: 999px;

      padding: 10px 14px;

      background: rgba(0, 0, 0, 0.48);

      color: #ffffff;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.08em;

      text-align: center;

      text-decoration: none;

      text-shadow: 0 0 8px rgba(0, 255, 255, 0.75);

      box-shadow:
        0 0 10px rgba(0, 255, 255, 0.25),
        inset 0 0 10px rgba(0, 255, 255, 0.06);

      cursor: pointer;

      pointer-events: auto;

      touch-action: manipulation;

      -webkit-tap-highlight-color: transparent;
    }


    .cyberwrap-account-button:active,
    #cyberwrap-website:active {

      transform: scale(0.96);

      background: rgba(0, 255, 255, 0.16);
    }


    #cyberwrap-website {

      position: absolute;

      top: max(20px, env(safe-area-inset-top));

      right: max(16px, env(safe-area-inset-right));

      margin: 0;

      border-width: 2px;

      padding: 11px 16px;

      color: #74ffff;

      font-size: 11px;
    }


    #cyberwrap-auth-modal {

      position: fixed;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 24px;

      background: rgba(0, 0, 0, 0.62);

      pointer-events: auto;

      z-index: 10;
    }


    #cyberwrap-auth-modal.visible {

      display: flex;
    }


    #cyberwrap-auth-panel {

      width: min(360px, 100%);

      box-sizing: border-box;

      padding: 24px;

      border: 1px solid rgba(255, 0, 0, 0.8);

      border-radius: 14px;

      background: rgba(5, 18, 28, 0.96);

      box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);

      color: #ffffff;

      font-family: Arial, Helvetica, sans-serif;
    }


    #cyberwrap-auth-panel h2 {

      margin: 0 0 18px;

      color: #74ffff;

      font-size: 20px;

      letter-spacing: 0.12em;

      text-align: center;
    }


    #cyberwrap-reward-status {

      display: none;

      position: fixed;

      top: max(20px, env(safe-area-inset-top));

      left: max(16px, env(safe-area-inset-left));

      width: min(280px, calc(100% - 32px));

      box-sizing: border-box;

      padding: 14px;

      border: 1px solid rgba(0, 255, 255, 0.55);

      border-radius: 12px;

      background: rgba(0, 0, 0, 0.7);

      color: #74ffff;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      line-height: 1.6;

      pointer-events: auto;

      z-index: 9;
    }


    #cyberwrap-reward-status.visible {

      display: block;
    }


    #cyberwrap-reward-status strong {

      color: #ffffff;
    }


    #cyberwrap-reward-status::after {

      content: "Limits: 2,000 points per 24 hours | 60 minutes per 7-day cycle";

      display: block;

      margin-top: 8px;

      color: rgba(255, 255, 255, 0.65);

      font-size: 10px;

      line-height: 1.4;
    }


    .cyberwrap-auth-field {

      display: block;

      width: 100%;

      box-sizing: border-box;

      margin: 0 0 10px;

      padding: 12px;

      border: 1px solid rgba(0, 255, 255, 0.35);

      border-radius: 8px;

      background: rgba(15, 23, 42, 0.8);

      color: #22d3ee;

      font: inherit;
    }


    #cyberwrap-auth-message {

      min-height: 18px;

      margin: 8px 0 14px;

      color: rgba(255, 255, 255, 0.78);

      font-size: 12px;

      line-height: 1.4;

      text-align: center;
    }


    #cyberwrap-auth-submit,
    #cyberwrap-auth-close {

      width: 100%;

      min-height: 42px;

      margin-top: 8px;

      border: 0;

      border-radius: 8px;

      background: linear-gradient(90deg, #dc2626, #9333ea, #06b6d4);

      color: #74ffff;

      font: inherit;

      font-weight: 700;

      cursor: pointer;

      box-shadow: 0 0 15px rgba(255, 0, 100, 0.4);

      transition: filter 0.15s ease;
    }


    #cyberwrap-auth-submit:hover {

      filter: brightness(1.25);
    }


    #cyberwrap-auth-close {

      border-color: rgba(255, 255, 255, 0.25);

      background: transparent;

      color: rgba(255, 255, 255, 0.75);

      font-size: 12px;

      box-shadow: none;
    }


    #cyberwrap-auth-name::placeholder,
    #cyberwrap-auth-phone::placeholder,
    #cyberwrap-auth-password::placeholder {

      color: rgba(8, 145, 178, 0.8);
    }


    /* =========================================================
   START AR BUTTON
========================================================= */

#cyberwrap-start-ar {

  appearance: none;
  -webkit-appearance: none;

  border: 2px solid rgba(0, 255, 255, 0.9);

  border-radius: 999px;

  padding: 16px 34px;

  min-width: 190px;

  background:
    rgba(0, 0, 0, 0.48);

  color: #ffffff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:
    clamp(17px, 5vw, 24px);

  font-weight: 700;

  letter-spacing:
    0.14em;

  text-align: center;

  text-shadow:
    0 0 8px rgba(0, 255, 255, 0.85),
    0 0 18px rgba(0, 255, 255, 0.55);

  box-shadow:
    0 0 12px rgba(0, 255, 255, 0.35),
    inset 0 0 12px rgba(0, 255, 255, 0.08);

  cursor: pointer;

  pointer-events: auto;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;

  -webkit-user-select: none;
  user-select: none;

  animation:
    cyberwrap-pulse 1.4s ease-in-out infinite;

  transition:
    transform 0.15s ease,
    background 0.15s ease,
    box-shadow 0.15s ease;
}


#cyberwrap-start-ar:active {

  transform: scale(0.96);

  background:
    rgba(0, 255, 255, 0.16);

  box-shadow:
    0 0 20px rgba(0, 255, 255, 0.7),
    inset 0 0 16px rgba(0, 255, 255, 0.15);
}


#cyberwrap-start-ar:disabled {

  opacity: 0.65;

  cursor: default;

  animation: none;
}

    /* =========================================================
       STARTING STATE
    ========================================================= */

    #cyberwrap-opener.starting #cyberwrap-start-ar {

  animation: none;

  opacity: 0.7;

  letter-spacing: 0.08em;
}


    /* =========================================================
       TAP PULSE
    ========================================================= */

    @keyframes cyberwrap-pulse {

      0%,
      100% {

        opacity: 0.45;

        transform: scale(0.98);
      }

      50% {

        opacity: 1;

        transform: scale(1);
      }

    }


    /* =========================================================
       DRIVEZONE PLACEMENT HINT
    ========================================================= */

    #cyberwrap-placement-hint {

      position: fixed;

      left: 50%;

      bottom: 12%;

      transform:
        translateX(-50%);

      z-index: 1000;

      width: 90%;

      text-align: center;

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(16px, 4vw, 26px);

      font-weight: 700;

      letter-spacing:
        0.12em;

      text-shadow:
        0 0 8px rgba(0, 255, 255, 0.9),
        0 0 18px rgba(0, 255, 255, 0.5);

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;

      opacity: 1;

      visibility: visible;

      animation:
        placement-pulse 1.4s ease-in-out infinite;
    }


    /* =========================================================
       HIDDEN PLACEMENT HINT
    ========================================================= */

    #cyberwrap-placement-hint.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      animation: none;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }


    /* =========================================================
       PLACEMENT PULSE
    ========================================================= */

    @keyframes placement-pulse {

      0%,
      100% {

        opacity: 0.55;
      }

      50% {

        opacity: 1;
      }

    }


    /* =========================================================
       BOOT PROTECTION
    ========================================================= */

    body.cyberwrap-booting {

      overflow: hidden;
    }


    /*
     * Hide normal HTML controls while CyberWrap
     * is still in its startup phase.
     *
     * The AR scene remains active underneath.
     */

    body.cyberwrap-booting button,
    body.cyberwrap-booting [role="button"],
    body.cyberwrap-booting input,
    body.cyberwrap-booting textarea,
    body.cyberwrap-booting select {

      visibility: hidden !important;

      pointer-events: none !important;
    }

body.cyberwrap-booting #cyberwrap-start-ar {

  visibility: visible !important;

  pointer-events: auto !important;
}

body.cyberwrap-booting #account-actions,
body.cyberwrap-booting #account-actions button {

  visibility: visible !important;

  pointer-events: auto !important;
}

body.cyberwrap-booting #cyberwrap-auth-modal.visible,
body.cyberwrap-booting #cyberwrap-auth-modal.visible input,
body.cyberwrap-booting #cyberwrap-auth-modal.visible button {

  visibility: visible !important;

  pointer-events: auto !important;
}

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      #opener-content {

        padding-bottom: 10vh;
      }

      #cyberwrap-start-ar {

      font-size:
        clamp(17px, 5vw, 24px);

      min-width: 180px;

      padding:
        15px 30px;

      letter-spacing:
        0.14em;
    }

      #cyberwrap-placement-hint {

        bottom: 11%;

        width: 92%;

        font-size:
          clamp(15px, 4.5vw, 22px);

        letter-spacing:
          0.10em;
      }

    }


    /* =========================================================
       VERY SMALL PHONES
    ========================================================= */

    @media (max-height: 600px) {

      #opener-content {

        padding-bottom: 7vh;
      }

      #opener-status {

        font-size: 16px;
      }

      #cyberwrap-placement-hint {

        bottom: 8%;
      }

    }


    /* =========================================================
       TABLETS
    ========================================================= */

    @media (min-width: 601px) {

      #cyberwrap-start-ar {

        font-size:
          clamp(20px, 3vw, 30px);
      }

    }


    /* =========================================================
       LANDSCAPE
    ========================================================= */

    @media (orientation: landscape) {

      #opener-content {

        padding-bottom: 6vh;
      }

      #cyberwrap-start-ar {

        font-size:
          clamp(16px, 3vw, 24px);
      }

      #cyberwrap-placement-hint {

        bottom: 8%;

        font-size:
          clamp(15px, 3vw, 22px);
      }

    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .opener-image {

        animation: none;

        transform:
          scale(1.04);
      }

      .opener-scanlines {

        animation: none;
      }

      #cyberwrap-start-ar {

      animation: none;

      opacity: 1;
      }

      #cyberwrap-placement-hint {

        animation: none;

        opacity: 1;
      }

    }


    /* =========================================================
       SAFARI / IOS TOUCH
    ========================================================= */

    #cyberwrap-opener,
    #cyberwrap-opener * {

      box-sizing: border-box;
    }


    #cyberwrap-opener {

      cursor: pointer;

      touch-action: manipulation;

      -webkit-touch-callout: none;

      -webkit-tap-highlight-color: transparent;
    }

  </style>

    src="/external/runtime/runtime.js">
  </script>


  <script

<!-- =========================================================
     BODY
========================================================= -->

<body class="cyberwrap-booting">


  <!-- =========================================================
       DRIVEZONE PLACEMENT INSTRUCTION

       This is intentionally NOT a button.

       pointer-events: none means the user's tap passes
       straight through to the AR / ECS touch system.
  ========================================================= -->



  <!-- =========================================================
       CYBERWRAP START OPENER

       There must be ONLY ONE element with this ID.
  ========================================================= -->

  <div id="cyberwrap-opener">

    <!-- Main artwork -->

    <div class="opener-image"></div>


    <!-- Digital scanlines -->

    <div class="opener-scanlines"></div>


    <!-- Cinematic vignette -->

    <div class="opener-vignette"></div>


    <!-- Start message -->

    <div id="opener-content">

    <div id="account-actions">

      <button
        id="cyberwrap-create-account"
        class="cyberwrap-account-button"
        type="button"
      >
        CREATE ACCOUNT
      </button>

      <button
        id="cyberwrap-sign-in"
        class="cyberwrap-account-button"
        type="button"
      >
        SIGN IN
      </button>

    </div>

    <a
      id="cyberwrap-website"
      href="https://dailybreadshawarma.store"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit Daily Bread Shawarma website"
    >
      ORDER ONLINE
    </a>

    <button
      id="cyberwrap-start-ar"
      type="button"
      aria-label="Start CyberWrap AR"
    >
      START AR
    </button>

</div>

    <div id="cyberwrap-auth-modal" aria-hidden="true">

      <form id="cyberwrap-auth-panel">

        <h2 id="cyberwrap-auth-title">CREATE ACCOUNT</h2>

        <input
          id="cyberwrap-auth-name"
          class="cyberwrap-auth-field"
          type="text"
          name="name"
          placeholder="Name"
          autocomplete="name"
          required
        >

        <input
          id="cyberwrap-auth-phone"
          class="cyberwrap-auth-field"
          type="tel"
          name="phone"
          placeholder="Phone Number (+country code)"
          autocomplete="tel"
          required
        >

        <input
          id="cyberwrap-auth-password"
          class="cyberwrap-auth-field"
          type="password"
          name="password"
          placeholder="Password"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <div id="cyberwrap-auth-message" role="status"></div>

        <button id="cyberwrap-auth-submit" type="submit">
          CREATE ACCOUNT
        </button>

        <button id="cyberwrap-auth-close" type="button">
          CLOSE
        </button>

      </form>

    </div>

    <div id="cyberwrap-reward-status" aria-live="polite">

      <strong>REWARD STATUS</strong><br>
      Cycle Points: <span id="reward-cycle-points">0 / 5000</span><br>
      Today's Points: <span id="reward-daily-points">0 / 2000</span><br>
      Gameplay: <span id="reward-play-seconds">0 / 60 minutes</span><br>
      Cycle Ends: <span id="reward-cycle-ends">Loading...</span>

    </div>

  </div>


  <!-- =========================================================
       CYBERWRAP APPLICATION
  ========================================================= -->

  <script src="bundle.js"></script>


</body>

</html>
