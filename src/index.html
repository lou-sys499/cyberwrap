<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>CyberWrap</title>


  <!-- =========================================================
       CYBERWRAP STYLES
  ========================================================= -->

  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      -webkit-tap-highlight-color: transparent;
    }


    body {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }


    /* =========================================================
       CYBERWRAP BOOT OPENER
    ========================================================= */

   #cyberwrap-opener {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100dvh;

  z-index: 2147483647;

  background: #000;

  opacity: 1;
  visibility: visible;

  pointer-events: auto;
  touch-action: manipulation;

  cursor: pointer;

  overflow: hidden;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;

  -webkit-tap-highlight-color: transparent;

  transition:
    opacity 0.8s ease,
    visibility 0.8s ease;
}

    /* =========================================================
       HIDDEN OPENER
    ========================================================= */

    #cyberwrap-opener.hidden {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}


    /* =========================================================
       OPENER IMAGE
    ========================================================= */

    .opener-image {

      position: absolute;

      inset: -6%;

      background-image:
        url("/assets/cyberwrap-main-opener.webp");

      background-position: center center;

      background-size: cover;

      background-repeat: no-repeat;

      transform-origin: center center;

      animation:
        opener-camera 4.5s ease-out forwards,
        opener-drift 4.5s ease-in-out infinite;

      will-change: transform;
    }


    /* =========================================================
       CINEMATIC CAMERA PUSH
    ========================================================= */

    @keyframes opener-camera {

      0% {
        transform: scale(1.02);
      }

      100% {
        transform: scale(1.13);
      }

    }


    /* =========================================================
       SUBTLE CAMERA DRIFT
    ========================================================= */

    @keyframes opener-drift {

      0% {
        translate: 0 0;
      }

      50% {
        translate: -0.7% -0.4%;
      }

      100% {
        translate: 0 0;
      }

    }


    /* =========================================================
       DIGITAL SCANLINES
    ========================================================= */

    .opener-scanlines {

      position: absolute;

      inset: 0;

      background:
        repeating-linear-gradient(
          to bottom,

          rgba(255, 255, 255, 0.025) 0px,

          rgba(255, 255, 255, 0.025) 1px,

          transparent 1px,

          transparent 5px
        );

      animation:
        scanline-move 1.8s linear infinite;

      pointer-events: none;

      mix-blend-mode: screen;
    }


    @keyframes scanline-move {

      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 80px;
      }

    }


    /* =========================================================
       CINEMATIC VIGNETTE
    ========================================================= */

    .opener-vignette {

      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          ellipse at center,

          transparent 42%,

          rgba(0, 0, 0, 0.68) 100%
        );

      pointer-events: none;
    }


    /* =========================================================
       START UI
    ========================================================= */

    #opener-content {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      padding-bottom: 11vh;

      pointer-events: none;
    }


    #cyberwrap-website {

      appearance: none;
      -webkit-appearance: none;

      box-sizing: border-box;

      border: 1px solid rgba(0, 255, 255, 0.75);

      border-radius: 999px;

      padding: 10px 14px;

      background: rgba(0, 0, 0, 0.48);

      color: #ffffff;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.08em;

      text-align: center;

      text-decoration: none;

      text-shadow: 0 0 8px rgba(0, 255, 255, 0.75);

      box-shadow:
        0 0 10px rgba(0, 255, 255, 0.25),
        inset 0 0 10px rgba(0, 255, 255, 0.06);

      cursor: pointer;

      pointer-events: auto;

      touch-action: manipulation;

      -webkit-tap-highlight-color: transparent;
    }


    #cyberwrap-website:active {

      transform: scale(0.96);

      background: rgba(0, 255, 255, 0.16);
    }


    #cyberwrap-website {

      position: absolute;

      top: max(20px, env(safe-area-inset-top));

      right: max(16px, env(safe-area-inset-right));

      margin: 0;

      border-width: 2px;

      padding: 11px 16px;

      color: #74ffff;

      font-size: 11px;
    }


    #cyberwrap-website {

      border: 0;

      background: #dc2626;

      color: #ffffff;

      text-shadow: none;

      box-shadow: none;
    }


    #cyberwrap-website:active {

      background: #b91c1c;
    }


    /* =========================================================
  PLAY BUTTON
========================================================= */

#cyberwrap-start {

  appearance: none;
  -webkit-appearance: none;

  border: 2px solid rgba(0, 255, 255, 0.9);

  border-radius: 999px;

  padding: 16px 34px;

  min-width: 190px;

  background:
    rgba(0, 0, 0, 0.48);

  color: #ffffff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:
    clamp(17px, 5vw, 24px);

  font-weight: 700;

  letter-spacing:
    0.14em;

  text-align: center;

  text-shadow:
    0 0 8px rgba(0, 255, 255, 0.85),
    0 0 18px rgba(0, 255, 255, 0.55);

  box-shadow:
    0 0 12px rgba(0, 255, 255, 0.35),
    inset 0 0 12px rgba(0, 255, 255, 0.08);

  cursor: pointer;

  pointer-events: auto;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;

  -webkit-user-select: none;
  user-select: none;

  animation:
    cyberwrap-pulse 1.4s ease-in-out infinite;

  transition:
    transform 0.15s ease,
    background 0.15s ease,
    box-shadow 0.15s ease;
}


#cyberwrap-start:active {

  transform: scale(0.96);

  background:
    rgba(0, 255, 255, 0.16);

  box-shadow:
    0 0 20px rgba(0, 255, 255, 0.7),
    inset 0 0 16px rgba(0, 255, 255, 0.15);
}


#cyberwrap-start:disabled {

  opacity: 0.65;

  cursor: default;

  animation: none;
}

    /* =========================================================
       STARTING STATE
    ========================================================= */

    #cyberwrap-opener.starting #cyberwrap-start {

  animation: none;

  opacity: 0.7;

  letter-spacing: 0.08em;
}


    /* =========================================================
       TAP PULSE
    ========================================================= */

    @keyframes cyberwrap-pulse {

      0%,
      100% {

        opacity: 0.45;

        transform: scale(0.98);
      }

      50% {

        opacity: 1;

        transform: scale(1);
      }

    }


    /* =========================================================
       DRIVEZONE PLACEMENT HINT
    ========================================================= */

    #cyberwrap-placement-hint {

      position: fixed;

      left: 50%;

      bottom: 12%;

      transform:
        translateX(-50%);

      z-index: 1000;

      width: 90%;

      text-align: center;

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(16px, 4vw, 26px);

      font-weight: 700;

      letter-spacing:
        0.12em;

      text-shadow:
        0 0 8px rgba(0, 255, 255, 0.9),
        0 0 18px rgba(0, 255, 255, 0.5);

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;

      opacity: 1;

      visibility: visible;

      animation:
        placement-pulse 1.4s ease-in-out infinite;
    }


    /* =========================================================
       HIDDEN PLACEMENT HINT
    ========================================================= */

    #cyberwrap-placement-hint.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      animation: none;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }


    /* =========================================================
       PLACEMENT PULSE
    ========================================================= */

    @keyframes placement-pulse {

      0%,
      100% {

        opacity: 0.55;
      }

      50% {

        opacity: 1;
      }

    }


    /* =========================================================
       BOOT PROTECTION
    ========================================================= */

    body.cyberwrap-booting {

      overflow: hidden;
    }


    /*
     * Hide normal HTML controls while CyberWrap
     * is still in its startup phase.
     *
     * The AR scene remains active underneath.
     */

    body.cyberwrap-booting button,
    body.cyberwrap-booting [role="button"],
    body.cyberwrap-booting input,
    body.cyberwrap-booting textarea,
    body.cyberwrap-booting select {

      visibility: hidden !important;

      pointer-events: none !important;
    }

body.cyberwrap-booting #cyberwrap-start {

  visibility: visible !important;

  pointer-events: auto !important;
}

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      #opener-content {

        padding-bottom: 10vh;
      }

      #cyberwrap-start {

      font-size:
        clamp(17px, 5vw, 24px);

      min-width: 180px;

      padding:
        15px 30px;

      letter-spacing:
        0.14em;
    }

      #cyberwrap-placement-hint {

        bottom: 11%;

        width: 92%;

        font-size:
          clamp(15px, 4.5vw, 22px);

        letter-spacing:
          0.10em;
      }

    }


    /* =========================================================
       VERY SMALL PHONES
    ========================================================= */

    @media (max-height: 600px) {

      #opener-content {

        padding-bottom: 7vh;
      }

      #opener-status {

        font-size: 16px;
      }

      #cyberwrap-placement-hint {

        bottom: 8%;
      }

    }


    /* =========================================================
       TABLETS
    ========================================================= */

    @media (min-width: 601px) {

      #cyberwrap-start {

        font-size:
          clamp(20px, 3vw, 30px);
      }

    }


    /* =========================================================
       LANDSCAPE
    ========================================================= */

    @media (orientation: landscape) {

      #opener-content {

        padding-bottom: 6vh;
      }

      #cyberwrap-start {

        font-size:
          clamp(16px, 3vw, 24px);
      }

      #cyberwrap-placement-hint {

        bottom: 8%;

        font-size:
          clamp(15px, 3vw, 22px);
      }

    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .opener-image {

        animation: none;

        transform:
          scale(1.04);
      }

      .opener-scanlines {

        animation: none;
      }

      #cyberwrap-start {

      animation: none;

      opacity: 1;
      }

      #cyberwrap-placement-hint {

        animation: none;

        opacity: 1;
      }

    }


    /* =========================================================
       SAFARI / IOS TOUCH
    ========================================================= */

    #cyberwrap-opener,
    #cyberwrap-opener * {

      box-sizing: border-box;
    }

    #cyberwrap-rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2147483648;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #07131b;
      color: #74ffff;
      font: 800 24px/1.2 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-align: center;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #cyberwrap-rotate {
        display: flex;
      }
    }


    #cyberwrap-opener {

      cursor: pointer;

      touch-action: manipulation;

      -webkit-touch-callout: none;

      -webkit-tap-highlight-color: transparent;
    }

  </style>


  <!-- =========================================================
       PAGE METADATA
  ========================================================= -->

  <meta
    itemprop="name"
    content="CyberWrap"
  >

  <meta
    name="twitter:title"
    content="CyberWrap"
  >

  <meta
    property="og:title"
    content="CyberWrap"
  >

  <meta
    property="og:site_name"
    content="CyberWrap"
  >

  <meta
    name="description"
    content="CyberWrap — an immersive WebAR delivery driving experience."
  >

  <meta
    itemprop="description"
    content="CyberWrap — an immersive WebAR delivery driving experience."
  >

  <meta
    property="og:description"
    content="CyberWrap — an immersive WebAR delivery driving experience."
  >

  <meta
    name="twitter:description"
    content="CyberWrap — an immersive WebAR delivery driving experience."
  >

  <script crossorigin="anonymous" src="/external/runtime/runtime.js"></script>


  <meta
    property="og:image"
    content="https://8thwall.org/studio-world-effects-example/assets/preview.png"
  >

</head>


<!-- =========================================================
     BODY
========================================================= -->

<body class="cyberwrap-booting">

  <div id="cyberwrap-rotate" aria-live="polite">ROTATE YOUR PHONE</div>


  <!-- =========================================================
       CYBERWRAP START OPENER

      There is one browser start control.
  ========================================================= -->

  <div id="cyberwrap-opener">

    <!-- Main artwork -->

    <div class="opener-image"></div>


    <!-- Digital scanlines -->

    <div class="opener-scanlines"></div>


    <!-- Cinematic vignette -->

    <div class="opener-vignette"></div>


    <!-- Start message -->

    <div id="opener-content">

    <a
      id="cyberwrap-website"
      href="https://dailybreadshawarma.store"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit Daily Bread Shawarma website"
    >
      ORDER ONLINE
    </a>

    <button
      id="cyberwrap-start"
      type="button"
      aria-label="Start CyberWrap"
    >
      PLAY
    </button>

</div>

  </div>


  <!-- =========================================================
       CYBERWRAP APPLICATION
  ========================================================= -->

  <script src="bundle.js"></script>


</body>

</html>
